name: publish-plugins

on:
  push:
    tags:
      - "plugins-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. plugins-v2026.02.13"
        required: true
        type: string
      iwp_runtime_release_tag:
        description: "Optional instructware.org runtime release tag, e.g. v1.0-draft-05"
        required: false
        type: string
      iwp_tools_release_tag:
        description: "Optional iwp-tools release tag, e.g. v0.1.7"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-plugins-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: dawnchat-plugins
      R2_PUBLIC_BASE_URL: https://plugins.dawnchat.com
      DEFAULT_IWP_RUNTIME_RELEASE_TAG: v1.0-draft-05
      DEFAULT_IWP_TOOLS_RELEASE_TAG: v0.1.7
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Avoid checkout's built-in recursive submodule auth/cleanup path.
          # We initialize submodules explicitly in the next step.
          submodules: false
          persist-credentials: true

      - name: Init submodules
        shell: bash
        run: |
          set -euo pipefail
          auth_header="$(git config --local --get http.https://github.com/.extraheader || true)"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [[ -n "${auth_header}" ]]; then
            git -c "http.https://github.com/.extraheader=${auth_header}" submodule sync --recursive
            # Do not use shallow submodule checkout here. The superproject pins
            # exact commits and they may not be the latest tip.
            git -c "http.https://github.com/.extraheader=${auth_header}" submodule update --init --recursive
          else
            git submodule sync --recursive
            git submodule update --init --recursive
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Print toolchain versions
        shell: bash
        run: |
          python --version
          node --version
          bun --version

      - name: Remove pnpm lockfiles
        shell: bash
        run: |
          find official-plugins -type f -name "pnpm-lock.yaml" -delete

      - name: Verify starter bun lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -f assistant-workspace/bun.lock
          test -f official-plugins/desktop-ai-assistant/_ir/frontend/web-src/bun.lock
          test -f official-plugins/desktop-hello-world/_ir/frontend/web-src/bun.lock
          test -f official-plugins/desktop-starter/_ir/frontend/web-src/bun.lock
          test -f official-plugins/web-starter-vue/web-src/bun.lock
          test -f official-plugins/mobile-starter-ionic/web-src/bun.lock

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve IWP release tags
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: iwp_tags
        shell: bash
        run: |
          runtime_tag="${{ github.event.inputs.iwp_runtime_release_tag }}"
          tools_tag="${{ github.event.inputs.iwp_tools_release_tag }}"
          if [[ -z "${runtime_tag}" && -z "${tools_tag}" ]]; then
            runtime_tag="${DEFAULT_IWP_RUNTIME_RELEASE_TAG}"
            tools_tag="${DEFAULT_IWP_TOOLS_RELEASE_TAG}"
          elif [[ -z "${runtime_tag}" || -z "${tools_tag}" ]]; then
            echo "iwp_runtime_release_tag and iwp_tools_release_tag must both be set or both be empty." >&2
            exit 1
          fi
          echo "runtime_tag=${runtime_tag}" >> "$GITHUB_OUTPUT"
          echo "tools_tag=${tools_tag}" >> "$GITHUB_OUTPUT"

      - name: Verify IWP runtime lock
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python scripts/sync_iwp_runtime.py --check

      - name: Refresh IWP runtime from release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python scripts/sync_iwp_runtime.py \
            --source release \
            --runtime-release-tag "${{ steps.iwp_tags.outputs.runtime_tag }}" \
            --tools-release-tag "${{ steps.iwp_tags.outputs.tools_tag }}" \
            --runtime-version "${{ steps.iwp_tags.outputs.runtime_tag }}"

      - name: Verify IWP runtime lock after refresh
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python scripts/sync_iwp_runtime.py --check

      - name: Build plugin packages
        run: |
          python scripts/package_plugins.py \
            --release-tag "${{ steps.release_tag.outputs.value }}" \
            --base-url "https://github.com/${REPO}/releases/download" \
            --output-dir ".dist/plugins"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          files: |
            .dist/plugins/*.dawnchat
            .dist/plugins/opencode-rules-*.zip
            .dist/plugins/plugins.json
          fail_on_unmatched_files: true
          generate_release_notes: true
